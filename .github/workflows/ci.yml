name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      # CI never has provider keys: tests use the deterministic stub adapter.
      - run: pnpm test

  compose:
    # Gate 6: a clean clone must reach healthy on every service.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: docker compose ps
      - if: always()
        run: docker compose down

  secrets:
    # Gate 8: the whole history is scanned for leaked credentials on every
    # push and PR (FEATURE-012, D028). Fixtures that are fake by design are
    # listed by fingerprint in .gitleaksignore, one line each, with the reason.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, not just the head commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
