# One-command spinup of The Negotiator. `docker compose up --build`.
# Ports: merchant 4001, buyer 4002, firewall 4003, settlement 4004,
# dashboard 4005 (localhost only).
# Secrets come from .env (copy .env.example); nothing is baked into images.

x-service: &service
  env_file: .env
  restart: unless-stopped

services:
  merchant:
    <<: *service
    build: { context: ., args: { SERVICE: merchant } }
    ports: ['4001:4001']
    environment: { PORT: 4001 }
    volumes:
      # Named volume (not a bind mount): inherits /app/data ownership from
      # the image, so the non-root service can write on any host. Inspect
      # with `docker compose cp merchant:/app/data/merchant.db .`
      - merchant-data:/app/data
    healthcheck: &healthcheck
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:$${PORT}/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  buyer:
    <<: *service
    build: { context: ., args: { SERVICE: buyer } }
    ports: ['4002:4002']
    environment: { PORT: 4002 }
    volumes:
      # Buyer sessions + replay guard memory (named volume, see merchant).
      - buyer-data:/app/data
    healthcheck: *healthcheck
    depends_on:
      merchant: { condition: service_healthy }
      firewall: { condition: service_healthy }

  firewall:
    <<: *service
    build: { context: ., args: { SERVICE: firewall } }
    ports: ['4003:4003']
    environment: { PORT: 4003 }
    volumes:
      # Registered mandates, carts and the append-only verdicts (named volume, see merchant).
      - firewall-data:/app/data
    healthcheck: *healthcheck
    depends_on:
      settlement: { condition: service_healthy }
      merchant: { condition: service_healthy }

  settlement:
    <<: *service
    build: { context: ., args: { SERVICE: settlement } }
    ports: ['4004:4004']
    environment: { PORT: 4004 }
    healthcheck: *healthcheck
    volumes:
      # SQLite ledger persists across restarts (named volume, see merchant).
      - settlement-data:/app/data

  dashboard:
    <<: *service
    build: { context: ., args: { SERVICE: dashboard, SERVICE_DIR: dashboard } }
    # Published on localhost ONLY: the console is a fully trusted operator
    # surface with no login of its own (THREAT_MODEL non-goals, D024).
    ports: ['127.0.0.1:4005:4005']
    environment: { PORT: 4005 }
    volumes:
      # The Evals tab reads the committed report (FEATURE-011); the image
      # only ships dashboard/ + packages/, so the artifact is bind-mounted
      # read-only from the checkout.
      - ./evals:/app/evals:ro
    healthcheck: *healthcheck
    depends_on:
      buyer: { condition: service_healthy }
      settlement: { condition: service_healthy }

volumes:
  merchant-data:
  buyer-data:
  firewall-data:
  settlement-data:
